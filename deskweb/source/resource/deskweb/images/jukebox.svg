<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" preserveAspectRatio="none">
  <defs>
    <linearGradient id="jbWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d99a4e"/>
      <stop offset=".45" stop-color="#a5641f"/>
      <stop offset="1" stop-color="#5e3210"/>
    </linearGradient>
    <linearGradient id="jbChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#dfe6ec"/>
      <stop offset=".6" stop-color="#9aa6b2"/>
      <stop offset="1" stop-color="#6b7580"/>
    </linearGradient>
    <linearGradient id="jbStrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef2"/>
      <stop offset=".5" stop-color="#aab4bd"/>
      <stop offset="1" stop-color="#7c868f"/>
    </linearGradient>
    <linearGradient id="jbScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2408"/>
      <stop offset="1" stop-color="#0a0602"/>
    </linearGradient>
    <radialGradient id="jbGlow" cx=".5" cy=".42" r=".75">
      <stop offset="0" stop-color="#ffbe45" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffbe45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jbPlaque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e0a026"/>
    </linearGradient>
    <linearGradient id="tubeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a2f12"/>
      <stop offset=".5" stop-color="#c98a4a"/>
      <stop offset="1" stop-color="#5a2f12"/>
    </linearGradient>
  </defs>

  <!-- outer chrome arch trim -->
  <path d="M8 256 L8 118 Q8 8 118 8 L882 8 Q992 8 992 118 L992 256 Z"
        fill="url(#jbChrome)"/>
  <!-- wood body -->
  <path d="M26 256 L26 122 Q26 26 122 26 L878 26 Q974 26 974 122 L974 256 Z"
        fill="url(#jbWood)" stroke="#3a2109" stroke-width="3"/>

  <!-- bubble tubes (left/right) with rising bubbles -->
  <g>
    <rect x="42" y="40" width="34" height="196" rx="17" fill="url(#tubeL)" stroke="#2e1808" stroke-width="2"/>
    <rect x="924" y="40" width="34" height="196" rx="17" fill="url(#tubeL)" stroke="#2e1808" stroke-width="2"/>
    <!-- left bubbles -->
    <circle cx="59" r="6" fill="#ff5a5a">
      <animate attributeName="cy" values="232;46" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="59" r="5" fill="#ffd23a">
      <animate attributeName="cy" values="232;46" dur="3.3s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.3s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="59" r="4" fill="#4ad06a">
      <animate attributeName="cy" values="232;46" dur="2.9s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.9s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- right bubbles -->
    <circle cx="941" r="6" fill="#4aa8ff">
      <animate attributeName="cy" values="232;46" dur="3.0s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.0s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="941" r="5" fill="#ff7ad0">
      <animate attributeName="cy" values="232;46" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="941" r="4" fill="#ffd23a">
      <animate attributeName="cy" values="232;46" dur="3.4s" begin="2.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- top plaque -->
  <rect x="330" y="9" width="340" height="22" rx="8" fill="url(#jbPlaque)" stroke="#8a5e12" stroke-width="1.5"/>
  <text x="500" y="25" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="15" font-weight="bold" fill="#5b3608" letter-spacing="3">♪ MIDI JUKEBOX ♪</text>

  <!-- display screen bezel + glass (region: x300-700 y36-140) -->
  <rect x="298" y="34" width="404" height="112" rx="14" fill="url(#jbChrome)"/>
  <rect x="308" y="44" width="384" height="92" rx="9" fill="url(#jbScreen)" stroke="#1a0f04" stroke-width="2"/>
  <rect x="308" y="44" width="384" height="92" rx="9" fill="url(#jbGlow)"/>

  <!-- lower brushed-metal control strip (region: x260-740 y158-232) -->
  <rect x="258" y="156" width="484" height="78" rx="14" fill="url(#jbStrip)" stroke="#5c666f" stroke-width="2"/>
  <rect x="258" y="156" width="484" height="10" rx="5" fill="#ffffff" opacity=".35"/>

  <!-- speaker grilles -->
  <g fill="#3a2109" opacity=".55">
    <rect x="110" y="70" width="150" height="150" rx="12" fill="#4a2a0e"/>
    <rect x="740" y="70" width="150" height="150" rx="12" fill="#4a2a0e"/>
  </g>
  <g stroke="#7a4a1e" stroke-width="3" opacity=".7">
    <line x1="122" y1="88" x2="248" y2="88"/><line x1="122" y1="106" x2="248" y2="106"/>
    <line x1="122" y1="124" x2="248" y2="124"/><line x1="122" y1="142" x2="248" y2="142"/>
    <line x1="122" y1="160" x2="248" y2="160"/><line x1="122" y1="178" x2="248" y2="178"/>
    <line x1="122" y1="196" x2="248" y2="196"/>
    <line x1="752" y1="88" x2="878" y2="88"/><line x1="752" y1="106" x2="878" y2="106"/>
    <line x1="752" y1="124" x2="878" y2="124"/><line x1="752" y1="142" x2="878" y2="142"/>
    <line x1="752" y1="160" x2="878" y2="160"/><line x1="752" y1="178" x2="878" y2="178"/>
    <line x1="752" y1="196" x2="878" y2="196"/>
  </g>
</svg>
