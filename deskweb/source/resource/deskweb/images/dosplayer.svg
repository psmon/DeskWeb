<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="dosMonitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e4d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8b4a8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dosScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a2a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- CRT monitor body -->
  <rect x="4" y="3" width="40" height="32" rx="3" fill="url(#dosMonitor)" stroke="#8a8678" stroke-width="1"/>

  <!-- Screen bezel -->
  <rect x="8" y="6" width="32" height="25" rx="2" fill="#3a3a3a"/>

  <!-- Screen -->
  <rect x="9.5" y="7.5" width="29" height="22" rx="1" fill="url(#dosScreen)"/>

  <!-- DOS prompt text -->
  <g font-family="monospace" fill="#33ff33">
    <text x="11.5" y="14" font-size="5">C:\&gt;_</text>
  </g>

  <!-- Green pixel game blocks -->
  <g fill="#33ff33" opacity="0.9">
    <rect x="12" y="18" width="3" height="3"/>
    <rect x="16" y="21" width="3" height="3"/>
    <rect x="20" y="18" width="3" height="3"/>
    <rect x="24" y="24" width="3" height="3"/>
  </g>
  <g fill="#ffcc00" opacity="0.9">
    <rect x="30" y="20" width="4" height="4"/>
  </g>

  <!-- Scanline effect -->
  <g stroke="#33ff33" stroke-width="0.4" opacity="0.15">
    <line x1="9.5" y1="11" x2="38.5" y2="11"/>
    <line x1="9.5" y1="16" x2="38.5" y2="16"/>
    <line x1="9.5" y1="21" x2="38.5" y2="21"/>
    <line x1="9.5" y1="26" x2="38.5" y2="26"/>
  </g>

  <!-- Monitor stand -->
  <rect x="19" y="35" width="10" height="4" fill="#b8b4a8"/>
  <rect x="13" y="39" width="22" height="4" rx="1.5" fill="url(#dosMonitor)" stroke="#8a8678" stroke-width="1"/>

  <!-- Power LED -->
  <circle cx="40" cy="33" r="1" fill="#33ff33"/>
</svg>
