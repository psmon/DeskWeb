name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install qooxdoo compiler
        run: npm install -g @qooxdoo/compiler

      - name: Build (production)
        working-directory: deskweb
        run: qx compile --target=build

      - name: Prepare Pages artifact
        working-directory: deskweb
        run: |
          touch compiled/build/.nojekyll
          if [ ! -f compiled/build/index.html ]; then
            cat > compiled/build/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0; url=./deskweb/" />
            <title>DeskWeb</title>
          </head>
          <body>
            <a href="./deskweb/">DeskWeb 열기</a>
          </body>
          </html>
          EOF
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deskweb/compiled/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
