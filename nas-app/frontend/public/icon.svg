<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="midiStage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a3a6a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="midiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc9900;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Stage background -->
  <rect x="2" y="2" width="44" height="44" rx="4" fill="url(#midiStage)" stroke="#5a5a9a" stroke-width="1"/>

  <!-- Spectrum bars -->
  <g opacity="0.85">
    <rect x="5"  y="30" width="3" height="13" fill="#ff4466"/>
    <rect x="9"  y="24" width="3" height="19" fill="#ff8844"/>
    <rect x="13" y="34" width="3" height="9"  fill="#ffcc44"/>
    <rect x="17" y="20" width="3" height="23" fill="#44dd66"/>
    <rect x="21" y="28" width="3" height="15" fill="#44ccdd"/>
    <rect x="25" y="16" width="3" height="27" fill="#4488ff"/>
    <rect x="29" y="26" width="3" height="17" fill="#8866ff"/>
    <rect x="33" y="32" width="3" height="11" fill="#cc66ff"/>
    <rect x="37" y="22" width="3" height="21" fill="#ff66cc"/>
    <rect x="41" y="30" width="3" height="13" fill="#ff4466"/>
  </g>

  <!-- Musical note (gold) -->
  <g fill="url(#midiGold)" stroke="#7a5c00" stroke-width="0.6">
    <ellipse cx="16" cy="20" rx="4.2" ry="3.2" transform="rotate(-15 16 20)"/>
    <rect x="19.2" y="7" width="2.2" height="13.5"/>
    <ellipse cx="30" cy="17" rx="4.2" ry="3.2" transform="rotate(-15 30 17)"/>
    <rect x="33.2" y="5" width="2.2" height="12"/>
    <path d="M 19.2 7 L 35.4 5 L 35.4 9 L 19.2 11 Z"/>
  </g>
</svg>
